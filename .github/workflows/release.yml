name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스 버전 (예: 2.0.0) — 태그 v<버전> 의 GitHub Release 가 먼저 있어야 한다"
        required: true
      overwrite:
        description: "이미 올린 같은 이름 설치 파일을 바꿀지 (사람들이 받아 간 파일이 다른 빌드로 바뀐다)"
        type: boolean
        default: false

# 빌드 잡은 읽기만: 빌드 중에 도는 남의 설치 스크립트가 저장소·릴리스에 쓰지 못하게. 올리기 잡만 쓴다
permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifacts: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            artifacts: |
              src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      # 실행한 브랜치 머리가 아니라 그 버전의 태그를 빌드한다. 토큰은 .git 에 남기지 않는다
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ github.event.inputs.version }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # 그 태그 커밋의 CI(엔진·화면·Rust, Windows·macOS)가 통과했어야 한다 — 실패한 커밋이 설치 파일로 나가지 않게
      - name: CI 통과 확인
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          ok=$(gh run list --repo ${{ github.repository }} --workflow CI --commit "$sha" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "${ok:-0}" -lt 1 ]; then
            echo "::error::태그 커밋 $sha 의 CI 가 통과하지 않았습니다(또는 아직 돌지 않았습니다). CI 를 통과시킨 뒤 다시 릴리스하세요"; exit 1
          fi

      # Rust 허용 목록이 RPC 계약과 어긋나면 설치본에서 그 기능이 막힌다
      - run: node scripts/sync-rpc-whitelist.mjs --check

      # 입력한 버전과 앱 버전이 다르면 다른 판 설치 파일이 그 릴리스에 올라간다
      - name: 버전 대조
        shell: bash
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$app" != "${{ github.event.inputs.version }}" ]; then
            echo "::error::입력 버전 ${{ github.event.inputs.version }} 과 tauri.conf.json 의 $app 이 다릅니다"; exit 1
          fi

      - name: 동봉 Node·사이드카·편집기 빌드
        run: |
          node scripts/fetch-node.mjs
          node scripts/build-sidecar.mjs
          node scripts/build-rhwp-studio.mjs

      # 운영체제마다 실리는 크레이트·네이티브 모듈이 달라 고지를 그 자리에서 다시 만든다
      - name: 제3자 고지 만들기
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml
          node scripts/third-party-notices.mjs

      # 깨진 엔진이 설치 파일로 넘어가기 전에 여기서 끊는다
      - name: 번들 스모크
        working-directory: node-sidecar
        run: node scripts/smoke-bundle.mjs

      - name: 시험 (엔진·화면)
        shell: bash
        run: |
          (cd node-sidecar && node node_modules/vitest/vitest.mjs run)
          pnpm exec vitest run

      # 코드 서명 — 저장소 시크릿이 있을 때만. 없으면 지금처럼 서명 없이(Windows SmartScreen·macOS Gatekeeper 경고)
      #   Windows: WINDOWS_CERTIFICATE(PFX base64)·WINDOWS_CERTIFICATE_PASSWORD
      #   macOS:   APPLE_CERTIFICATE(p12 base64)·APPLE_CERTIFICATE_PASSWORD·APPLE_SIGNING_IDENTITY, 공증은 APPLE_ID·APPLE_PASSWORD(앱 암호)·APPLE_TEAM_ID
      - name: Windows 서명 인증서 가져오기
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host "서명 인증서 없음: 서명 없이 만든다"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 설치 파일 만들기
        # beforeBuildCommand(build:all) 가 위 단계를 다시 돌지 않게 프론트만 빌드.
        # Windows 기본 셸(PowerShell)은 인라인 JSON 의 따옴표를 벗겨 버려서 bash 로
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          config=$(node -e '
            const c = { build: { beforeBuildCommand: "pnpm build" }, bundle: {} };
            const e = process.env;
            if (e.WINDOWS_CERT_THUMBPRINT) c.bundle.windows = { certificateThumbprint: e.WINDOWS_CERT_THUMBPRINT, digestAlgorithm: "sha256", timestampUrl: "http://timestamp.digicert.com" };
            if (process.platform === "darwin" && e.APPLE_SIGNING_IDENTITY) c.bundle.macOS = { signingIdentity: e.APPLE_SIGNING_IDENTITY };
            process.stdout.write(JSON.stringify(c));
          ')
          # 공증 변수가 비어 있으면 넘기지 않는다(빈 값으로 공증을 시도하지 않게)
          [ -n "$APPLE_ID" ] || unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          [ -n "$APPLE_CERTIFICATE" ] || unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          pnpm tauri build --config "$config"

      - uses: actions/upload-artifact@v4
        with:
          name: kordoc-ai-${{ matrix.os }}
          path: ${{ matrix.artifacts }}

  upload:
    name: Upload to Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 같은 이름 파일이 이미 있으면 기본은 실패: 받아 간 설치 파일을 말없이 다른 빌드로 바꾸지 않는다
          clobber=""
          if [ "${{ github.event.inputs.overwrite }}" = "true" ]; then clobber="--clobber"; fi
          find out -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" \) -print0 \
            | xargs -0 gh release upload "v${{ github.event.inputs.version }}" --repo ${{ github.repository }} $clobber
