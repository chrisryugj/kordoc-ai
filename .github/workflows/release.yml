name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-installer:
    name: Build NSIS Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # CI에서는 kordoc을 npm registry에서 설치
      - name: Patch kordoc dependency for CI
        shell: bash
        run: |
          cd node-sidecar
          sed -i 's|"kordoc": "link:../../kordoc"|"kordoc": "^2.2.2"|' package.json
          rm -f pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install node-sidecar dependencies
        working-directory: node-sidecar
        run: pnpm install

      - name: Build Node.js sidecar (esbuild bundle)
        working-directory: node-sidecar
        run: node esbuild.config.mjs && node postbuild.mjs

      - name: Build Tauri NSIS Installer
        run: pnpm tauri build

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: kordoc-ai-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

  release:
    name: Create Release
    needs: build-installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kordoc-ai-installer
          path: installer

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: KorDoc AI v${{ github.event.inputs.version }}
          body: |
            ## KorDoc AI v${{ github.event.inputs.version }}

            ### 설치 방법
            1. 아래 `.exe` 설치 파일 다운로드
            2. 실행하여 설치
            3. **Node.js 20+** 필요 ([다운로드](https://nodejs.org/))
            4. 앱 실행 후 설정에서 Gemini API 키 입력

            ### 시스템 요구사항
            - Windows 10/11
            - Node.js 20+
          files: installer/*.exe
          draft: false
          prerelease: false
