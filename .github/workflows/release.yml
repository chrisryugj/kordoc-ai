name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-msi:
    name: Build MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      # CI에서는 kordoc을 npm registry에서 설치
      - name: Build Node.js sidecar
        shell: bash
        run: |
          # 버전은 레포 루트 .kordoc-version 하나만 본다 — ci.yml 과 같은 값을 쓴다.
          KORDOC_VERSION="$(tr -d '[:space:]' < .kordoc-version)"
          echo "번들 kordoc: ^$KORDOC_VERSION"
          cd node-sidecar
          sed -i "s|\"kordoc\": \"link:../../kordoc\"|\"kordoc\": \"^$KORDOC_VERSION\"|" package.json
          rm -f pnpm-lock.yaml
          npm install
          npx tsc
          node esbuild.config.mjs

      - name: Build Tauri MSI
        run: pnpm tauri build

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: kordoc-ai-msi
          path: src-tauri/target/release/bundle/msi/*.msi

  upload:
    name: Upload MSI to Release
    needs: build-msi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kordoc-ai-msi
          path: msi

      - name: Upload MSI to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ github.event.inputs.version }}" msi/*.msi --repo ${{ github.repository }} --clobber
