name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스 버전 (예: 2.0.0) — 태그 v<버전> 의 GitHub Release 가 먼저 있어야 한다"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifacts: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            artifacts: |
              src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - name: 동봉 Node·사이드카·편집기 빌드
        run: |
          node scripts/fetch-node.mjs
          node scripts/build-sidecar.mjs
          node scripts/build-rhwp-studio.mjs

      # 운영체제마다 실리는 크레이트·네이티브 모듈이 달라 고지를 그 자리에서 다시 만든다
      - name: 제3자 고지 만들기
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml
          node scripts/third-party-notices.mjs

      # 깨진 엔진이 설치 파일로 넘어가기 전에 여기서 끊는다
      - name: 번들 스모크
        working-directory: node-sidecar
        run: node scripts/smoke-bundle.mjs

      - name: 설치 파일 만들기
        # beforeBuildCommand(build:all) 가 위 단계를 다시 돌지 않게 프론트만 빌드.
        # Windows 기본 셸(PowerShell)은 인라인 JSON 의 따옴표를 벗겨 버려서 bash 로
        shell: bash
        run: pnpm tauri build --config '{"build":{"beforeBuildCommand":"pnpm build"}}'

      - uses: actions/upload-artifact@v4
        with:
          name: kordoc-ai-${{ matrix.os }}
          path: ${{ matrix.artifacts }}

  upload:
    name: Upload to Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find out -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" \) -print0 \
            | xargs -0 gh release upload "v${{ github.event.inputs.version }}" --repo ${{ github.repository }} --clobber
