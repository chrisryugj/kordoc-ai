name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-sidecar-test:
    name: Node Sidecar Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: node-sidecar/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: node-sidecar
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: node-sidecar
        run: pnpm test

  typescript-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit

  rust-check:
    name: Rust Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Create frontend dist placeholder
        run: mkdir dist && echo "<!-- placeholder -->" > dist/index.html

      - name: Create sidecar dist placeholder
        run: mkdir node-sidecar\dist && echo "// placeholder" > node-sidecar\dist\index.js

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --lib
