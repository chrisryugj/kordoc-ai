name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-sidecar-test:
    name: Node Sidecar Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install with published kordoc
        shell: bash
        working-directory: node-sidecar
        run: |
          # 로컬 개발은 link:../../kordoc (모노레포 인접 체크아웃)이지만
          # CI는 npm 배포본으로 치환 — 실제 kordoc 함수로 E2E 통합 검증한다.
          sed -i 's|"kordoc": "link:../../kordoc"|"kordoc": "^3.1.1"|' package.json
          npm install
          git checkout package.json

      - name: Run tests
        working-directory: node-sidecar
        run: npx vitest run

  typescript-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit

  rust-check:
    name: Rust Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Create frontend dist placeholder
        run: mkdir dist && echo "<!-- placeholder -->" > dist/index.html

      - name: Create sidecar dist placeholder
        run: mkdir node-sidecar\dist && echo "// placeholder" > node-sidecar\dist\index.js

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --lib
