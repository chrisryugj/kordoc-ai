name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-sidecar-test:
    name: Node Sidecar Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install with published kordoc
        shell: bash
        working-directory: node-sidecar
        run: |
          # 로컬 개발은 link:../../kordoc (모노레포 인접 체크아웃)이지만
          # CI는 npm 배포본으로 치환 — 실제 kordoc 함수로 E2E 통합 검증한다.
          # 버전은 레포 루트 .kordoc-version 하나만 본다 (ci·release 가 어긋나면
          # CI 통과 도장과 배포본이 다른 kordoc 을 쓰게 된다 — v1.5.0 이전 실제 사고).
          KORDOC_VERSION="$(tr -d '[:space:]' < ../.kordoc-version)"
          echo "kordoc 핀: ^$KORDOC_VERSION"
          sed -i "s|\"kordoc\": \"link:../../kordoc\"|\"kordoc\": \"^$KORDOC_VERSION\"|" package.json
          npm install
          git checkout package.json

      # 핀이 npm 최신보다 뒤처지면 알린다. 실패시키지는 않는다 — kordoc 은 자주
      # 배포돼서(주 단위) 실패로 걸면 무관한 PR 이 계속 막힌다. 알림만으로 충분.
      - name: kordoc 핀 뒤처짐 감지
        shell: bash
        run: |
          PINNED="$(tr -d '[:space:]' < .kordoc-version)"
          LATEST="$(npm view kordoc version 2>/dev/null || echo "$PINNED")"
          if [ "$PINNED" != "$LATEST" ]; then
            echo "::warning::kordoc 핀 $PINNED < npm 최신 $LATEST — .kordoc-version 갱신 검토"
          else
            echo "kordoc 핀이 최신($LATEST)과 일치"
          fi

      - name: Run tests
        working-directory: node-sidecar
        run: npx vitest run

      # vitest 는 node_modules 가 옆에 있는 개발 환경에서 돈다 — 번들에 안 들어간
      # 모듈을 절대 못 잡는다. 사용자 PC와 같은 조건(node_modules 없음)으로 실제
      # 번들을 띄워봐야 한다. v1.5.0 이 cfb 를 놓친 채 배포된 게 이 구멍 때문이다.
      - name: Sidecar 번들 스모크 (엔진 기동 확인)
        shell: bash
        working-directory: node-sidecar
        run: |
          KORDOC_VERSION="$(tr -d '[:space:]' < ../.kordoc-version)"
          sed -i "s|\"kordoc\": \"link:../../kordoc\"|\"kordoc\": \"^$KORDOC_VERSION\"|" package.json
          npm install
          npx tsc
          node esbuild.config.mjs
          node scripts/smoke-bundle.mjs
          git checkout package.json

  typescript-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit

  rust-check:
    name: Rust Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Create frontend dist placeholder
        run: mkdir dist && echo "<!-- placeholder -->" > dist/index.html

      - name: Create sidecar dist placeholder
        run: mkdir node-sidecar\dist && echo "// placeholder" > node-sidecar\dist\index.js

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --lib
