[package]
name = "kordoc-ai"
version = "1.5.1"
description = "KorDoc AI — HWP/HWPX/PDF/XLSX/DOCX 문서 변환·요약·비교·병합 데스크톱 도구"
authors = ["Chris"]
edition = "2021"

[lib]
name = "kordoc_ai_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "^2.5", features = [] }

[dependencies]
tauri = { version = "^2.10", features = ["tray-icon"] }
tauri-plugin-dialog = "^2.6"
tauri-plugin-process = "^2.3"
tauri-plugin-shell = "^2.2"
tauri-plugin-window-state = "^2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-deep-link = "=2.4.7"
tauri-plugin-single-instance = { version = "=2.4.0", features = ["deep-link"] }
tauri-plugin-notification = "2.3.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[profile.release]
panic = "unwind"
codegen-units = 4
lto = "thin"
opt-level = 3
strip = "debuginfo"
