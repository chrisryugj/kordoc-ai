# OSV-Scanner 무시 목록 (공공 GitLab push 보안스캔 · scripts/contest-gate.mjs 저장소 관문 공용, Cargo.lock 대상)
#
# 고칠 판이 있는 것은 판을 올려 지웠다(2026-11-03: tauri 2.12.5, 알림 플러그인 2.8.0, tokio·anyhow·event-listener·serde_with).
# 아래는 고칠 판이 없거나, 상위 크레이트가 옛 판을 고정해 이 레포에서 바꿀 수 없는 전이 의존이다.
# 하나같이 직접 의존이 아니고, 대부분 정보성 권고(관리 중단·unsound)이며 알려진 공격 경로가 우리 앱에 닿지 않는다.
# 상위 크레이트가 갈아타면 항목을 지운다. (2026-11-03 점검)

