[package]
name = "kordoc-launcher"
version = "0.1.0"
edition = "2021"
description = "KorDoc Shell Extension launcher — translates context menu verb to kordoc:// deep-link"
authors = ["KorDoc"]

[[bin]]
name = "kordoc-launcher"
path = "src/main.rs"

[dependencies]
urlencoding = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
