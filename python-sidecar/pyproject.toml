[project]
name = "eduplan-ai-sidecar"
version = "1.0.0"
description = "EduPlan AI Python sidecar for document processing"
requires-python = ">=3.10"

dependencies = [
    "google-genai>=1.9.0,<2.0",
    "PyMuPDF>=1.24.0,<2.0",
    "pypdf>=4.0.0,<6.0",
    "openpyxl>=3.1.0,<4.0",
    "python-docx>=1.0.0,<2.0",
    "reportlab>=4.0.0,<5.0",
    "pyyaml>=6.0,<7.0",
    "Pillow>=10.0.0,<12.0",
    "numpy>=1.24.0,<3.0",
]

[project.optional-dependencies]
hwp = ["pyhwpx>=0.3.0,<1.0"]
browser = ["playwright>=1.40.0,<2.0"]
