# ============================================================
# OCR 품질 규칙 (MVP 1에서 사용)
# ============================================================

# 텍스트 정제 규칙
cleaning:
  # 과도한 공백 임계치 (이 이상의 연속 공백은 하나로 줄임)
  max_consecutive_spaces: 20

  # 무의미한 구분선으로 판단할 최소 길이
  garbage_line_min_length: 10

  # 구분선 문자 패턴
  garbage_chars: "[-=_*]"

  # 중복 라인 제거 여부
  remove_duplicates: true

# OCR 프롬프트
prompt: |
  이미지 속의 모든 정보를 마크다운(Markdown)으로 정밀하게 변환해.

  **[초정밀 추출 지침]**

  1. **표(Table) 완전성:** 표의 모든 행과 열을 빠짐없이 마크다운 표 형식으로 변환해.
     데이터가 많거나 복잡해도 절대 생략하거나 빈 칸으로 두지 마.
     셀 안에 여러 줄이 있어도 한 셀 안에 유지해 (줄바꿈 대신 쉼표 등으로 연결).

  2. **계층 구조 (가장 중요):**
     - 문서의 제목/소제목은 `#`, `##`, `###` 헤딩을 사용해.
     - 본문 텍스트는 불릿 없이 일반 문단으로 작성해. 원본이 `◦`, `○` 등의 기호로 시작하는 항목만 불릿(`-`)으로 변환해.
     - 특히 **괄호로 시작하는 본문 항목** (예: "(AI 전환 가속화 대응) 정부 및...")은 불릿이 아니라 **일반 문단의 볼드 키워드**로 처리해.
       예시: `**(AI 전환 가속화 대응)** 정부 및 공공기관의...`
     - 하위 항목은 들여쓰기한 불릿(`  - `)으로 구분해.

  3. **각주 처리:**
     - 본문의 `*`, `**` 표시 각주는 불릿이 아니다. 별도의 각주 블록으로 처리해.
     - 형식: `> *주) MVP(Minimum Viable Product): 최소한의...`
     - 절대로 각주를 일반 불릿(`- *`, `- **`)으로 변환하지 마.

  4. **페이지 번호 제거:** `- 1 -`, `- 2 -` 등 페이지 하단의 쪽번호는 출력하지 마.

  5. **누락 방지:** 텍스트가 작거나 복잡한 레이아웃에 있어도 문맥을 파악하여 모두 추출해.

  6. **서식:** HTML 태그(<br>)는 절대 사용하지 마. 마크다운 코드블록(```)으로 감싸지 마.

  7. **원문 보존:** 공공문서의 고유 명칭·수치·약어는 절대 수정하지 마. OCR 인식 오류(명백한 글자 깨짐)만 복원하고, 문서 작성자의 표현을 임의로 교정하지 마.

  8. **다이어그램/순서도:** 플로우차트나 구조도는 단순 리스트 대신 흐름을 표현해:
     - 순서: `1. A → 2. B → 3. C`
     - 분기: `조건? → [Yes] 처리A / [No] 처리B`
     - 계층: 들여쓰기로 상위/하위 관계 표현

  9. **강조 박스:** 원본에서 색상 배경이나 테두리로 강조된 텍스트는 인용문(`>`)으로 처리해.

  10. **순수 결과물:** '결과입니다' 같은 설명 없이 마크다운 텍스트만 출력해.
